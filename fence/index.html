<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fence Planner Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>🪵 Fence Planner</h2>
            <p class="subtitle">Click and drag on the grid to build your fence segments around the residence.</p>
            
<div class="metrics">
    <div class="metric-card">
        <span class="label">Total Footage</span>
        <span class="value" id="total-feet">0 <small>lin ft</small></span>
    </div>
    <div class="metric-card">
        <span class="label">Posts ($55.50 ea)</span>
        <span class="value" id="total-posts">0 <small>posts</small></span>
    </div>
    <div class="metric-card">
        <span class="label">2x4 Rails ($11.28 ea)</span>
        <span class="value" id="total-lumber">0 <small>boards</small></span>
    </div>
    <div class="metric-card">
        <span class="label">Total Material Cost</span>
        <span class="value cost" id="total-cost">$0.00</span>
    </div>
</div>

            <div class="actions">
                <button id="clear-btn" class="btn-secondary">Reset Layout</button>
            </div>
        </aside>

        <main class="canvas-area">
            <div class="canvas-wrapper">
                <canvas id="fenceCanvas" width="800" height="600"></canvas>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
